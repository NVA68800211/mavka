<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MAVKA | Как нас найти</title>

    <!-- Определяем качество интернета ДО загрузки картинок.
         net-slow  — слабая связь: значки не летают и не крутятся, следов нет.
         net-awful — совсем плохая связь (2G / экономия трафика): значки не грузятся вообще. -->
    <script>
        (function () {
            var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            var t = c && c.effectiveType;
            var awful = !!c && (c.saveData || t === 'slow-2g' || t === '2g' || (c.downlink && c.downlink < 0.4));
            var slow = awful || (!!c && t === '3g');
            var d = document.documentElement;
            if (awful) d.classList.add('net-awful');
            if (slow) d.classList.add('net-slow');
            window.__net = { awful: awful, slow: slow, imgSlow: false };
        })();
    </script>

    <!-- Шрифт Soyuz Grotesk: прямое подключение CSS с CDN (вместо сломанного @import) -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/soyuz-grotesk" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.cdnfonts.com/css/soyuz-grotesk"></noscript>

    <style>
        :root {
            --accent: #dedf8b;                          /* тот самый «красивый зелёный» при наведении */
            --ink: #1e272e;
            --paper: #fefefe;
            --s: clamp(58px, 17vw, 100px);              /* базовый размер значка */
            --cpad: clamp(16px, 5vw, 24px);             /* внутренний отступ карточки */
            --notch: 11px;                              /* радиус боковых «укусов» билета */
            --radius: 28px;
        }

        * { -webkit-tap-highlight-color: transparent; }

        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: hidden; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #efefef;
            margin: 0;
            /* вокруг карточки оставляем место, чтобы увеличенные значки не уходили за экран */
            padding: max(calc(var(--s) * 0.6), env(safe-area-inset-top)) calc(var(--s) * 0.56 + 2px)
                     max(calc(var(--s) * 0.6), env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Общий контейнер для карточки и летающего декора */
        .page-wrapper {
            position: relative;
            width: 100%;
            max-width: 430px;
        }

        /* ───────── БИЛЕТ (так же устроен, как на основном сайте) ───────── */
        /* обёртка: мягкая тень по реальному силуэту билета (вместе с вырезами) */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            filter: drop-shadow(0 8px 18px rgba(30, 39, 46, 0.07));
        }

        /* Секция билета: белое тело + настоящие прозрачные «укусы» по бокам через mask */
        .seg {
            position: relative;
            background: var(--paper);
            padding: 18px var(--cpad);
            box-sizing: border-box;
            --cut-tl: radial-gradient(circle at 0 0,       #0000 calc(var(--notch) - .5px), #000 var(--notch));
            --cut-tr: radial-gradient(circle at 100% 0,    #0000 calc(var(--notch) - .5px), #000 var(--notch));
            --cut-bl: radial-gradient(circle at 0 100%,    #0000 calc(var(--notch) - .5px), #000 var(--notch));
            --cut-br: radial-gradient(circle at 100% 100%, #0000 calc(var(--notch) - .5px), #000 var(--notch));
            -webkit-mask-image: var(--cut-tl), var(--cut-tr), var(--cut-bl), var(--cut-br);
            mask-image: var(--cut-tl), var(--cut-tr), var(--cut-bl), var(--cut-br);
            -webkit-mask-composite: source-in;
            mask-composite: intersect;
        }
        .seg--first {
            border-radius: var(--radius) var(--radius) 0 0;
            padding-top: 44px;
            padding-bottom: 28px;
            -webkit-mask-image: var(--cut-bl), var(--cut-br);
            mask-image: var(--cut-bl), var(--cut-br);
        }
        .seg--last {
            border-radius: 0 0 var(--radius) var(--radius);
            padding-bottom: 40px;
            -webkit-mask-image: var(--cut-tl), var(--cut-tr);
            mask-image: var(--cut-tl), var(--cut-tr);
        }

        /* Пунктир перфорации разрезан по шву на две половинки */
        .seg:not(.seg--first)::before,
        .seg:not(.seg--last)::after {
            content: '';
            position: absolute;
            left: calc(var(--notch) + 8px);
            right: calc(var(--notch) + 8px);
            height: 2px;
            background-size: 10px 100%;
            background-repeat: repeat-x;
            opacity: 0.5;
            pointer-events: none;
        }
        .seg:not(.seg--first)::before {
            top: 0;
            background-image: radial-gradient(circle at 50% 0, #a5b1c2 1.9px, transparent 2.4px);
        }
        .seg:not(.seg--last)::after {
            bottom: 0;
            background-image: radial-gradient(circle at 50% 100%, #a5b1c2 1.9px, transparent 2.4px);
        }

        /* Верхний заголовок */
        .brand-title {
            font-family: 'Soyuz Grotesk', 'Arial Black', sans-serif;
            font-size: clamp(22px, 6.6vw, 32px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ink);
            margin: 0;
        }

        /* Блок с кнопками-плашками */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Плашки выбора: текст строго по центру */
        .link-btn {
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: 18px 14px;
            text-decoration: none;
            background: var(--paper);
            color: var(--ink);
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.07);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.01);
            transition: background-color 0.3s ease, border-color 0.3s ease,
                        box-shadow 0.3s ease, transform 0.3s ease;
            cursor: pointer;
            box-sizing: border-box;
            min-width: 0;
        }
        .link-btn::before { content: '📍'; font-size: 14px; }

        /* Наведение и тап: тот же красивый #dedf8b, что и на основном сайте, текст остаётся тёмным */
        .link-btn:hover,
        .link-btn:focus-visible,
        .link-btn:active {
            background-color: #dedf8b !important;
            color: #1e272e !important;
            border-color: rgba(30, 39, 46, 0.12);
        }
        .link-btn:hover,
        .link-btn:focus-visible {
            box-shadow: 0 8px 20px rgba(222, 223, 139, 0.45);
            transform: translateY(-2px);
            outline: none;
        }
        .link-btn:active { transform: translateY(1px); }

        /* «Наш адрес» — без плашки, как заголовки разделов на основном сайте, и выровнен влево */
        .category-title {
            font-family: 'Tahoma', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a5b1c2;
            margin: 0 0 6px 0;
            text-align: left;
            padding-left: 5px;
        }
        .address-text {
            font-size: 14px;
            color: #2f3640;
            line-height: 1.45;
            font-weight: 600;
            text-align: left;
            padding-left: 5px;
        }

        /* ==========================================================================
           ЗНАЧКИ: плавное парение + 3D-разворот
           .decor-container — место на странице, .decor-float — парение, .decor-card — разворот
           ========================================================================== */
        .decor-container {
            position: absolute;
            width: var(--s);
            height: var(--s);
            z-index: 3;                /* все значки, включая клевер, поверх белой карточки */
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .decor-container.is-ready { opacity: 1; }

        .decor-float {
            width: 100%;
            height: 100%;
            perspective: 600px;
            will-change: translate, rotate;
            animation:
                drift  var(--dur, 7s)  ease-in-out var(--del, 0s) infinite alternate,
                sway   var(--rdur, 9s) ease-in-out var(--del, 0s) infinite alternate;
        }

        /* разворот рулит скрипт (пружина), поэтому CSS-transition тут нет */
        .decor-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .face {
            position: absolute;
            inset: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.08));
            -webkit-user-drag: none;
        }
        .face.back { transform: rotateY(180deg); }

        @keyframes drift {
            from { translate: 0 0; }
            to   { translate: var(--ax, 6px) var(--ay, -12px); }
        }
        @keyframes sway {
            from { rotate: var(--r0, -3deg); }
            to   { rotate: var(--r1, 4deg); }
        }

        /* Позиции и характер движения (размеры считаются от --s) */
        .i1 { width: calc(var(--s) * 1.1);  height: calc(var(--s) * 1.1);
              top: calc(var(--s) * -0.35);  left: calc(var(--s) * -0.38);
              --dur: 7.5s; --rdur: 10s; --del: 0s;     --ax: 5px;  --ay: -11px; --r0: -4deg; --r1: 3deg; }   /* Клевер */
        .i2 { width: calc(var(--s) * 1.2);  height: calc(var(--s) * 1.2);
              top: calc(var(--s) * 1.05);   left: calc(var(--s) * -0.5);
              --dur: 8.5s; --rdur: 11s; --del: -2s;    --ax: -6px; --ay: -13px; --r0: 3deg;  --r1: -4deg; }  /* 2ГИС (крупнее) */
        .i3 { top: calc(var(--s) * 0.75);   right: calc(var(--s) * -0.42);
              --dur: 6.5s; --rdur: 9s;  --del: -3.5s;  --ax: 7px;  --ay: -10px; --r0: -3deg; --r1: 5deg; }   /* Яндекс */
        .i4 { width: calc(var(--s) * 0.88); height: calc(var(--s) * 0.88);
              bottom: calc(var(--s) * 0.75); left: calc(var(--s) * -0.56);
              --dur: 9s;   --rdur: 12s; --del: -5s;    --ax: 5px;  --ay: -12px; --r0: 4deg;  --r1: -3deg; }  /* Плюс */
        .i5 { bottom: calc(var(--s) * 1.55); right: calc(var(--s) * -0.42);
              --dur: 7s;   --rdur: 10.5s; --del: -1s;  --ax: -5px; --ay: -11px; --r0: -4deg; --r1: 4deg; }  /* Google */
        .i6 { width: calc(var(--s) * 0.62); height: calc(var(--s) * 0.62);
              top: calc(var(--s) * -0.5);   right: calc(var(--s) * 0.18);
              --dur: 8s;   --rdur: 11.5s; --del: -4s;  --ax: -4px; --ay: -9px;  --r0: 5deg;  --r1: -4deg; }  /* Клевер №2 */
        .i7 { width: calc(var(--s) * 0.7);  height: calc(var(--s) * 0.7);
              bottom: calc(var(--s) * -0.4); left: calc(var(--s) * 0.85);
              --dur: 9.5s; --rdur: 13s; --del: -6s;    --ax: 5px;  --ay: -8px;  --r0: -5deg; --r1: 4deg; }  /* Клевер №3 */

        /* ==========================================================================
           ФОН: следы лапок и обуви, которые появляются и исчезают (только при хорошем интернете)
           ========================================================================== */
        .prints { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .print  { position: absolute; left: 0; top: 0; color: #a5b1c2; fill: currentColor; opacity: 0; }

        /* Совсем плохой интернет: значков нет вообще. Слабый интернет / «меньше движения»: всё стоит на месте */
        html.net-awful .decor-container { display: none; }
        html.net-slow .decor-float { animation: none; }
        html.net-slow .prints { display: none; }
        @media (prefers-reduced-motion: reduce) {
            .decor-float { animation: none; }
            .prints { display: none; }
            .link-btn { transition-duration: 0.01s; }
        }

        @media (max-width: 340px) {
            .link-btn { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- Рисунки следов (кошачья лапка, птичья лапка, подошва) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="pr-cat" viewBox="0 0 40 40">
            <ellipse cx="20" cy="27" rx="10" ry="8"/>
            <ellipse cx="8"  cy="17" rx="4"  ry="5"   transform="rotate(-20 8 17)"/>
            <ellipse cx="16" cy="9"  rx="4"  ry="5.5"/>
            <ellipse cx="24" cy="9"  rx="4"  ry="5.5"/>
            <ellipse cx="32" cy="17" rx="4"  ry="5"   transform="rotate(20 32 17)"/>
        </symbol>
        <symbol id="pr-bird" viewBox="0 0 40 40">
            <path d="M20 34 L20 6 M20 34 L6 14 M20 34 L34 14 M20 34 L20 39" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        </symbol>
        <symbol id="pr-shoe" viewBox="0 0 40 40">
            <path d="M20 2 C28 2 32 8 31 16 C30.5 21 26 23 20 23 C14 23 9.5 21 9 16 C8 8 12 2 20 2Z"/>
            <path d="M20 27 C26 27 29 30 28 34 C27.5 38 24.5 40 20 40 C15.5 40 12.5 38 12 34 C11 30 14 27 20 27Z"/>
        </symbol>
    </svg>
    <div class="prints" id="prints" aria-hidden="true"></div>

    <div class="page-wrapper">

        <!-- Декоративные значки. Картинки вшиты в страницу (таблица ICONS в конце файла), от внешних ссылок сайт не зависит.
             data-keep — этот значок при развороте НЕ меняется (клевер и плюс) -->
        <div class="decor-container i1" data-keep aria-hidden="true">
            <div class="decor-float"><div class="decor-card">
                <div class="face front"><img data-icon="clover" alt=""></div>
                <div class="face back"><img data-icon="clover" alt=""></div>
            </div></div>
        </div>

        <div class="decor-container i2" aria-hidden="true">
            <div class="decor-float"><div class="decor-card">
                <div class="face front"><img data-icon="gis" alt=""></div>
                <div class="face back"><img data-icon="gis" alt=""></div>
            </div></div>
        </div>

        <div class="decor-container i3" aria-hidden="true">
            <div class="decor-float"><div class="decor-card">
                <div class="face front"><img data-icon="yandex" alt=""></div>
                <div class="face back"><img data-icon="yandex" alt=""></div>
            </div></div>
        </div>

        <div class="decor-container i4" data-keep aria-hidden="true">
            <div class="decor-float"><div class="decor-card">
                <div class="face front"><img data-icon="plus" alt=""></div>
                <div class="face back"><img data-icon="plus" alt=""></div>
            </div></div>
        </div>

        <div class="decor-container i5" aria-hidden="true">
            <div class="decor-float"><div class="decor-card">
                <div class="face front"><img data-icon="google" alt=""></div>
                <div class="face back"><img data-icon="google" alt=""></div>
            </div></div>
        </div>

        <div class="decor-container i6" data-keep aria-hidden="true">
            <div class="decor-float"><div class="decor-card">
                <div class="face front"><img data-icon="clover" alt=""></div>
                <div class="face back"><img data-icon="clover" alt=""></div>
            </div></div>
        </div>

        <div class="decor-container i7" data-keep aria-hidden="true">
            <div class="decor-float"><div class="decor-card">
                <div class="face front"><img data-icon="clover" alt=""></div>
                <div class="face back"><img data-icon="clover" alt=""></div>
            </div></div>
        </div>

        <!-- Билет из трёх секций -->
        <div class="container">

            <section class="seg seg--first">
                <h1 class="brand-title">мы на картах</h1>
            </section>

            <!-- data-icon — значок, в который превращаются все значки при наведении -->
            <section class="seg">
                <div class="links-wrapper">
                    <a href="https://2gis.ru" target="_blank" rel="noopener" class="link-btn" data-type="2gis"
                       data-icon="gis">открыть в 2GIS</a>
                    <a href="https://yandex.ru" target="_blank" rel="noopener" class="link-btn" data-type="yandex"
                       data-icon="yandex">открыть в Яндекс Карты</a>
                    <a href="https://google.com" target="_blank" rel="noopener" class="link-btn" data-type="google"
                       data-icon="google">открыть в Google Maps</a>
                </div>
            </section>

            <section class="seg seg--last">
                <div class="category-title">Наш адрес</div>
                <div class="address-text">
                    г. Великий Новгород, проспект Мира, д. 21, корпус 1 (мини-рынок «Западный»)
                </div>
            </section>

        </div>
    </div>

    <!-- Значки вшиты в страницу. Исходные прямые ссылки (на случай, если понадобятся):
         clover  — https://i.ibb.co/HpDCHxXK/image.png
         gis     — https://i.ibb.co/Q77zjGT3/2.png
         yandex  — https://i.ibb.co/Dg70qRtT/image.png
         plus    — https://i.ibb.co/hxLq6kHY/image.png
         google  — https://i.ibb.co/FLQVkh8W/image.png -->

    <script>
        (function () {
            var net = window.__net || {};
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function animationsOff() {
                if (net.awful || net.slow || net.imgSlow || reduceMotion) return true;
                var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (c) {
                    var t = c.effectiveType;
                    if (c.saveData || t === 'slow-2g' || t === '2g' || t === '3g') return true;
                }
                return false;
            }
            function rnd(a, b) { return a + Math.random() * (b - a); }

            /* ───── Загрузка значков (не грузим при совсем плохом интернете) ───── */
            var containers = [].slice.call(document.querySelectorAll('.decor-container'));
            var cards = containers.map(function (box) {
                var imgs = [box.querySelector('.front img'), box.querySelector('.back img')];
                return {
                    box: box,
                    el: box.querySelector('.decor-card'),
                    imgs: imgs,
                    keep: box.hasAttribute('data-keep'),   // клевер и плюс не меняют картинку
                    orig: window.ICONS[imgs[0].getAttribute('data-icon')],
                    theta: 0, vel: 0, target: 0,
                    lastKey: '', timer: 0
                };
            });

            cards.forEach(function (c) {
                c.imgs[0].onload = function () { c.imgs[0].onload = null; c.box.classList.add('is-ready'); };
                c.imgs[0].src = c.orig;
                c.imgs[1].src = c.orig;
            });

            /* ───── Разворот ─────
               Каждый значок крутится «на пружине»: можно менять цель в любой момент, движение не рвётся и не ждёт.
               Каждый разворот — всегда +180° в одну сторону. Новая картинка ставится на ту сторону, которая в этот
               момент не видна, поэтому подмены не заметно. */
            var STAGGER = 45;                 // «волна» между значками, мс
            var OMEGA = 7.5;                  // жёсткость пружины: больше = быстрее
            var desired = '', raf = 0, last = 0, waiters = [], locked = false, leaveTimer = null, gone = false;

            function logoFor(type) {
                var b = document.querySelector('.link-btn[data-type="' + type + '"]');
                return b ? window.ICONS[b.getAttribute('data-icon')] : null;
            }

            function mod2(n) { return ((n % 2) + 2) % 2; }

            function retarget(c) {
                var key = desired;
                if (key === c.lastKey) return;
                c.lastKey = key;
                var url = c.keep ? c.orig : ((key && logoFor(key)) || c.orig);
                var arriving = mod2(c.target / 180);           // сторона, к которой сейчас летим
                if (c.theta < c.target - 90) {
                    // летим, но новая сторона ещё не показалась: просто меняем на ней картинку — поворот не удлиняется
                    c.imgs[arriving].src = url;
                } else {
                    // сторона уже на виду (или стоим): делаем ещё один разворот на скрытую сторону
                    c.target += 180;
                    c.imgs[mod2(c.target / 180)].src = url;
                }
            }

            function settle() {
                if (raf || cards.some(function (c) { return c.timer; })) return;
                var list = waiters; waiters = [];
                list.forEach(function (fn) { fn(); });
            }

            function tick(now) {
                var dt = Math.min(0.05, (now - last) / 1000);
                last = now;
                var moving = false;
                cards.forEach(function (c) {
                    var x = c.target - c.theta;
                    c.vel += (OMEGA * OMEGA * x - 2 * OMEGA * c.vel) * dt;   // критически затухающая пружина
                    c.theta += c.vel * dt;
                    if (Math.abs(x) < 0.15 && Math.abs(c.vel) < 0.5) { c.theta = c.target; c.vel = 0; }
                    else moving = true;
                    c.el.style.transform = 'rotateY(' + c.theta.toFixed(2) + 'deg)';
                });
                if (moving) raf = requestAnimationFrame(tick);
                else { raf = 0; settle(); }
            }

            function kick() {
                if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
            }

            function setDesired(key) {
                if (locked || animationsOff()) return;
                desired = key;
                cards.forEach(function (c, i) {
                    clearTimeout(c.timer);
                    c.timer = setTimeout(function () { c.timer = 0; retarget(c); kick(); }, i * STAGGER);
                });
            }

            function go(href) {
                if (gone) return;
                gone = true;
                window.location.href = href;   // в той же вкладке: так переход не блокируют браузеры
            }

            [].forEach.call(document.querySelectorAll('.link-btn'), function (btn) {
                var type = btn.getAttribute('data-type');

                function enter() { clearTimeout(leaveTimer); setDesired(type); }
                function leave() {
                    clearTimeout(leaveTimer);
                    // короткая пауза: при переходе с кнопки на кнопку значки не дёргаются туда-сюда
                    leaveTimer = setTimeout(function () { setDesired(''); }, 60);
                }

                btn.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') enter(); });
                btn.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') leave(); });
                btn.addEventListener('focus', enter);
                btn.addEventListener('blur', leave);

                btn.addEventListener('click', function (e) {
                    // Ctrl/Cmd/Shift-клик и средняя кнопка работают как обычная ссылка
                    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
                    e.preventDefault();
                    if (animationsOff()) { go(btn.href); return; }

                    clearTimeout(leaveTimer);
                    setDesired(type);
                    locked = true;                       // дальше значки не трогаем, ждём конца разворота
                    waiters.push(function () { setTimeout(function () { go(btn.href); }, 220); });
                    if (!raf) setTimeout(settle, STAGGER * cards.length + 20);
                });
            });

            // Возврат кнопкой «Назад» (bfcache): значки снова становятся обычными
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) {
                    gone = false;
                    locked = false;
                    waiters = [];
                    setDesired('');
                }
            });

            /* ───── Фон: следы лапок и обуви, которые появляются и тают ─────
               Включается только при хорошем интернете. Чтобы выключить совсем: FOOTPRINTS = false. */
            var FOOTPRINTS = true;
            var layer = document.getElementById('prints');

            if (FOOTPRINTS && layer && typeof Element.prototype.animate === 'function') {
                var cardEl = document.querySelector('.container');
                var TYPES = [
                    { sym: 'pr-cat',  size: 22, step: 36, gap: 11, count: [10, 16], every: 430, life: 4600, peak: .55, mirror: true  },
                    { sym: 'pr-bird', size: 17, step: 20, gap: 6,  count: [14, 22], every: 240, life: 3800, peak: .6,  mirror: false },
                    { sym: 'pr-shoe', size: 32, step: 58, gap: 15, count: [8, 13],  every: 650, life: 5200, peak: .5,  mirror: true  }
                ];
                var NS = 'http://www.w3.org/2000/svg';

                function place(type, k, x, y, ang, left) {
                    var size = type.size * k;
                    var svg = document.createElementNS(NS, 'svg');
                    svg.setAttribute('class', 'print');
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    svg.setAttribute('viewBox', '0 0 40 40');
                    var use = document.createElementNS(NS, 'use');
                    use.setAttribute('href', '#' + type.sym);
                    svg.appendChild(use);
                    var rot = ang * 180 / Math.PI + 90;
                    svg.style.transform = 'translate(' + (x - size / 2).toFixed(1) + 'px,' + (y - size / 2).toFixed(1) +
                                          'px) rotate(' + rot.toFixed(1) + 'deg)' + (left && type.mirror ? ' scaleX(-1)' : '');
                    layer.appendChild(svg);
                    var peak = Math.min(.78, type.peak * (k > 1 ? 1.2 : 1));
                    var a = svg.animate(
                        [{ opacity: 0 }, { opacity: peak, offset: .1 }, { opacity: peak, offset: .55 }, { opacity: 0 }],
                        { duration: type.life, easing: 'ease-out', fill: 'both' }
                    );
                    a.onfinish = function () { if (svg.parentNode) svg.parentNode.removeChild(svg); };
                }

                function nextTrail(delay) { setTimeout(trail, delay); }

                /* Свободные полосы вокруг белой плашки: на телефоне она закрывает почти весь экран,
                   поэтому следы идут по верхней и нижней полосе и вдоль боковых полей, а не прячутся под ней. */
                function lanes() {
                    var r = cardEl.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, z = [];
                    if (r.top > 60)         z.push({ horiz: true,  a0: 14,           a1: r.top - 14,     weight: vw * (r.top - 28) });
                    if (vh - r.bottom > 60) z.push({ horiz: true,  a0: r.bottom + 14, a1: vh - 14,       weight: vw * (vh - r.bottom - 28) });
                    if (r.left > 44)        z.push({ horiz: false, a0: 8,            a1: r.left - 8,     weight: vh * (r.left - 16) });
                    if (vw - r.right > 44)  z.push({ horiz: false, a0: r.right + 8,  a1: vw - 8,         weight: vh * (vw - r.right - 16) });
                    return z;
                }

                function pickLane(z) {
                    var total = z.reduce(function (s, l) { return s + l.weight; }, 0), t = Math.random() * total;
                    for (var i = 0; i < z.length; i++) { t -= z[i].weight; if (t <= 0) return z[i]; }
                    return z[z.length - 1];
                }

                function trail() {
                    if (document.hidden || animationsOff()) { nextTrail(3000); return; }
                    var type = TYPES[Math.floor(Math.random() * TYPES.length)];
                    var vw = window.innerWidth, vh = window.innerHeight;
                    var k = vw < 600 ? 1.3 : 1;                       // на телефоне следы крупнее
                    var z = lanes(), lane = z.length ? pickLane(z) : null;
                    var x, y, base, curve = rnd(-.04, .04);

                    if (lane) {
                        var half = type.size * k * 0.8;
                        var c = rnd(lane.a0 + half, Math.max(lane.a0 + half, lane.a1 - half));   // дорожка внутри полосы
                        var dir = Math.random() < .5 ? 1 : -1;
                        if (lane.horiz) { y = c; x = dir > 0 ? -20 : vw + 20; base = dir > 0 ? 0 : Math.PI; }
                        else            { x = c; y = dir > 0 ? -20 : vh + 20; base = dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
                    } else {
                        x = -20; y = rnd(.1, .9) * vh; base = 0;      // запасной вариант: просто через экран
                    }
                    var ang = base, n = Math.round(rnd(type.count[0], type.count[1])), i = 0, left = false;
                    var step = type.step * k, gap = type.gap * k;

                    (function stepOnce() {
                        if (i >= n || document.hidden || animationsOff() ||
                            x < -80 || x > vw + 80 || y < -80 || y > vh + 80) { nextTrail(rnd(2200, 5000)); return; }
                        ang += (base - ang) * 0.25 + curve + rnd(-.07, .07);    // чуть виляет, но держится своей полосы
                        x += Math.cos(ang) * step;
                        y += Math.sin(ang) * step;
                        if (lane) {                                              // и не заходит под плашку
                            if (lane.horiz) y = Math.min(Math.max(y, lane.a0 + gap), lane.a1 - gap);
                            else            x = Math.min(Math.max(x, lane.a0 + gap), lane.a1 - gap);
                        }
                        var off = (left ? -1 : 1) * gap / 2;
                        place(type, k, x + Math.cos(ang + Math.PI / 2) * off, y + Math.sin(ang + Math.PI / 2) * off, ang, left);
                        left = !left; i++;
                        setTimeout(stepOnce, type.every * rnd(.85, 1.15));
                    })();
                }

                nextTrail(1800);
            }
        })();
    </script>
